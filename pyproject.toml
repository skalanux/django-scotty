[project]
name = "django-scotty"
version = "0.3.2"
description = "Advanced tables for django cruds"
readme = "README.md"
authors = [
    { name = "Juan Manuel Schillaci", email = "jmschillaci@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django-cotton>=2.1.3",
    "django-crispy-forms>=2.4",
    "django-filter>=25.2",
    "django-htmx>=1.26.0",
    "django-tables2>=2.7.5",
    "tablib[xlsx]>=3.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-django>=4",
    "factory-boy>=3",
]
lint = ["ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

addopts = ["--strict-markers"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/django_scotty"]
omit = ["*/tests/*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[dependency-groups]
dev = [
    "django-stubs>=5.2.0",
    "factory-boy>=3.3.3",
    "mypy>=1.15",
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.17",
]
